repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npm run lint
        language: system
        files: \.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: typecheck
        name: tsc
        entry: npm run typecheck
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
